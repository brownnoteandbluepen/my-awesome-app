apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-awesome-app
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-awesome-app
  template:
    metadata:
      labels:
        app: my-awesome-app
    spec:
      containers:
        - name: my-awesome-app
          image: image: ghcr.io/brownnoteandbluepen/my-awesome-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80